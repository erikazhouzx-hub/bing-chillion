<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bing Chillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Pixelify+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-market arcade screen. Indigo night sky, cream panels with chunky pixel outlines, red lanterns on a string, gold coins. */
:root{
  --night:#1a1330; --tile:#2a1f4d; --edge:#4a3a80; --paper:#fff3d6; --ink:#1d1424;
  --red:#d7261e; --redd:#9e1510; --gold:#f2b632; --jade:#2fa37a; --soft:#b9add9; --dim:#6b5a48;
  --px:"Press Start 2P","Courier New",monospace;
  --body:"Pixelify Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--night);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.45}
#app{max-width:440px;margin:0 auto;padding:0 20px 56px;display:flex;flex-direction:column;gap:22px;min-height:100vh}
svg,canvas{display:block;flex:none}
p{margin:0}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0;line-height:1.6;text-wrap:balance}
h1{font-size:18px} h2{font-size:15px} h3{font-size:12px}
.lbl{font-family:var(--px);font-size:9px;line-height:1.7;text-transform:uppercase;color:var(--paper);font-variant-numeric:tabular-nums}
.panel .lbl{color:var(--dim)}
.lbl.gold{color:var(--gold)} .lbl.red{color:var(--red)} .lbl.soft{color:var(--soft)}
.center{text-align:center}
.mast{flex-wrap:wrap}
.mastr{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--px);font-size:10px;line-height:1.4;color:var(--paper)}
.title{font-family:var(--px);font-size:26px;line-height:1.35;color:var(--red);text-shadow:3px 3px 0 var(--gold);display:flex;flex-direction:column;gap:2px}
.title span{display:flex;align-items:center;gap:10px}
@media (max-width:380px){.title{font-size:21px}}
.mus{font-family:var(--px);font-size:8px;line-height:1.5;text-transform:uppercase;border:0;border-radius:0;padding:6px;cursor:pointer;background:var(--gold);color:var(--night)}
.mus[aria-pressed="false"]{background:var(--edge);color:var(--paper)}
.mus:focus-visible{outline:4px solid var(--jade);outline-offset:4px}
.scene{margin:4px;line-height:0;box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold)}
.scene canvas{width:100%;height:auto;image-rendering:pixelated}
.pts.big{font-size:18px}
.lbl.warn{color:#ff8a6e}
.field{display:flex;flex-direction:column;gap:8px}
.field input[type=text]{border-color:var(--gold)}
/* lantern string */
.garland{display:flex;justify-content:space-between;align-items:flex-start;border-top:4px solid #6b4a2b;padding:0 6px;height:86px}
.lan{padding-top:var(--h);background:linear-gradient(#6b4a2b,#6b4a2b) top center/3px var(--h) no-repeat;transform-origin:top center;animation:sway 1.6s steps(2,end) infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:4px dashed var(--gold);padding-bottom:12px}
/* pixel outline: four hard shadows make notched corners */
.panel{background:var(--paper);color:var(--ink);padding:18px;margin:4px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 -4px 0 0 var(--gold),0 4px 0 0 var(--gold),-4px 0 0 0 var(--gold),4px 0 0 0 var(--gold),0 10px 0 0 #0b0717}
.panel p{color:var(--dim)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seal{background:var(--red);padding:6px;margin:3px;line-height:0;flex:none;
  box-shadow:0 -3px 0 0 var(--redd),0 3px 0 0 var(--redd),-3px 0 0 0 var(--redd),3px 0 0 0 var(--redd)}
.btn{font-family:var(--px);font-size:12px;line-height:1.6;text-transform:uppercase;color:var(--paper);background:var(--red);border:0;border-radius:0;
  padding:16px 12px 20px;margin:4px;width:calc(100% - 8px);cursor:pointer;
  box-shadow:0 -4px 0 0 var(--paper),0 4px 0 0 var(--paper),-4px 0 0 0 var(--paper),4px 0 0 0 var(--paper),inset 0 -6px 0 0 var(--redd)}
.panel .btn{box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -6px 0 0 var(--redd)}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:var(--tile);box-shadow:0 -4px 0 0 var(--soft),0 4px 0 0 var(--soft),-4px 0 0 0 var(--soft),4px 0 0 0 var(--soft),inset 0 -6px 0 0 var(--night)}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--jade);outline-offset:6px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:1.2;text-align:center;color:var(--soft)}
.tile{width:56px;height:56px;margin:3px;display:grid;place-items:center;background:var(--tile);flex:none;
  box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:2px dashed var(--edge);align-items:baseline}
.rules .lbl{flex:none}
.note{font-size:15px;color:var(--soft);border-left:4px solid var(--gold);padding-left:10px}
/* play */
.play{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center}
.secs{font-family:var(--px);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{height:16px;margin:4px;background:var(--tile);position:relative;overflow:hidden;
  box-shadow:0 -4px 0 0 var(--paper),0 4px 0 0 var(--paper),-4px 0 0 0 var(--paper),4px 0 0 0 var(--paper)}
.bar i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,var(--night) 10px 12px)}
.qcat{display:flex;align-items:center;gap:12px}
.chip{font-family:var(--px);font-size:9px;line-height:1.6;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:6px 8px}
.qpanel{margin-top:8px}
.qpanel h2{min-height:96px}
input[type=text]{width:100%;font:500 20px var(--body);padding:12px;border:4px solid var(--ink);border-radius:0;background:#fff;color:var(--ink)}
/* result */
.score{font-family:var(--px);font-size:52px;line-height:1.15;color:var(--red);text-shadow:4px 4px 0 var(--gold);font-variant-numeric:tabular-nums}
.rank{display:flex;justify-content:space-between;align-items:center;border-top:4px dashed var(--ink);padding-top:12px;gap:12px}
.rank strong{font-family:var(--px);font-size:10px;font-weight:400;line-height:1.6;text-align:right}
.sec{display:flex;flex-direction:column;gap:16px}
.sec>h3{color:var(--gold);border-bottom:4px dashed var(--gold);padding-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qa{padding:14px;gap:8px}
.qa .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qa .top strong{font-size:16px;line-height:1.3}
.pts{font-family:var(--px);font-size:10px;color:var(--red);flex:none}
.pts.zero{color:var(--dim)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 56px 24px;gap:8px;align-items:center;font-size:15px}
.row span:first-child{overflow-wrap:anywhere}
.row .m{height:8px;background:#e6d5b0;overflow:hidden}
.row .m i{display:block;height:100%;background:#c98f14}
.row.me{font-weight:700}.row.me .m i{background:var(--red)}
.row .n{font-family:var(--px);font-size:8px;text-align:right;color:var(--dim)}
.tag{font-family:var(--px);font-size:7px;line-height:1.4;background:var(--red);color:var(--paper);padding:3px 4px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.lb{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:2px dashed #cdbb9a;align-items:baseline}
.lb:last-child{border-bottom:0}
.lb .lbl{color:var(--red)}
.lb.me{font-weight:700}
.lb span:nth-child(2){overflow-wrap:anywhere}
.acts{display:flex;flex-direction:column;gap:12px}
@media (max-width:360px){.score{font-size:40px} h1{font-size:16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// norm: lower case, no tone marks, no "the/a/an" at the start, no spaces or punctuation, traditional -> simplified
function norm(s){
  const x=String(s||"").normalize("NFKD").replace(/\p{M}/gu,"").toLowerCase().trim().replace(/^(the|an|a)\s+/,"");
  return [...x].map(ch=>T2S[ch]||ch).join("").replace(/[\s\p{P}\p{S}]/gu,"");
}
const INDEX = Q.map(q=>{ // spelling -> {name, note, ok}
  const m=new Map();
  q.d.split(";").map(e=>e.trim()).filter(Boolean).forEach(entry=>{
    const parts=entry.split("|"); let [name,note]=parts[0].split("@");
    const ok=!name.startsWith("!"); name=name.replace(/^!/,"").trim();
    const rec={name, note:(note||"").trim(), ok};
    [name, ok?rec.note:"", ...parts.slice(1)].forEach(a=>{const k=norm(a); if(k && !m.has(k)) m.set(k,rec);});
  });
  return m;
});
function match(qi, raw){
  const n=norm(raw); if(!n) return null;
  const m=INDEX[qi];
  if(m.has(n)) return m.get(n);
  if(n.endsWith("s") && m.has(n.slice(0,-1))) return m.get(n.slice(0,-1));
  let best=null,len=0;                       // fallback: longest known answer inside a longer phrase
  for(const [k,rec] of m){
    const min=/[^\x00-\x7f]/.test(k)?2:4;
    if(k.length>=min && k.length>len && n.includes(k)){best=rec;len=k.length;}
  }
  return best;
}
// Rarity Score = 100 / sqrt(1 + N), N = OTHER players who gave the same answer. Not on the list = 0.
function rarity(sameCount){ return sameCount>0 ? 100/Math.sqrt(sameCount) : 0; }
function compute(plays){ // plays: [{id, a:[7 strings]}]
  const counts=Q.map(()=>new Map());
  plays.forEach(p=>Q.forEach((_,i)=>{const a=p.a[i]; if(a) counts[i].set(a,(counts[i].get(a)||0)+1);}));
  const rows=plays.map(p=>{
    const per=Q.map((_,i)=>p.a[i]?rarity(counts[i].get(p.a[i])):0);
    return {id:p.id, per, score:per.reduce((x,y)=>x+y,0)/Q.length, t:p.t||0};
  }).sort((x,y)=>y.score-x.score||x.t-y.t);
  return {counts, rows};
}
function tierOf(score){ return TIERS.find(t=>score>=t[0]); }

  for(let x=NODES[0][0];x<W;x++){ const y=Math.round(wallY(x));
    if(x<=bx){ px("#bfa98a",x,y,1,3); px("#7d6a55",x,y+3); if(x%3!==2) px("#e0cfae",x,y-1); }    // built wall
    else if(x<=NODES[7][0] && x%3===0) px("#4f8a74",x,y+1); }                                    // dotted plan for the rest
  px("#bfa98a",3,61,7,8); px("#5c4a3a",5,65,3,4); px("#d7261e",3,60,7,1);                        // start gate
  NODES.slice(1).forEach(([tx,ty],i)=>{                                                          // watchtowers
    if(p>=i+1-1e-6){ px("#cdb893",tx-3,ty-7,7,10); px("#e0cfae",tx-4,ty-8,9,1); [-4,-2,0,2,4].forEach(d=>px("#e0cfae",tx+d,ty-9));
      px("#f2b632",tx-1,ty-5,2,2); px("#5c4a3a",tx-1,ty,2,3); px("#6b4a2b",tx,ty-14,1,5); px("#d7261e",tx+1,ty-14,3,2); }
    else { px("#4f8a74",tx,ty-3,1,4); px("#4f8a74",tx-1,ty-4,3,1); } });                         // a stake where a tower will go
  const x=bx; let y=Math.round(wallY(x))-1;                                                      // the builder
  NODES.slice(1).forEach(([tx,ty],i)=>{ if(p>=i+1-1e-6 && Math.abs(x-tx)<=4) y=ty-9; });
  px("#f2b632",x-1,y-5,3,1); px("#ffd9a8",x,y-4); px("#d7261e",x-1,y-3,3,2);
  if(frame%2){ px("#1d1424",x-1,y-1); px("#1d1424",x+1,y-1); px("#e0cfae",x+2,y-3,2,2); }        // carrying a brick
  else { px("#1d1424",x,y-1); px("#e0cfae",x+2,y-2,2,2); }
}
function wallScene(from,to){ // a picture of the wall; it grows from "from" to "to"
  const cv=document.createElement("canvas"); cv.width=120; cv.height=76;
  cv.setAttribute("role","img"); cv.setAttribute("aria-label",`Great Wall built: ${Math.round(to*1000)} of 7000 metres`);
  const c=cv.getContext("2d"), still=from===to||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  if(still){ drawWall(c,to,0); }
  else{ const t0=performance.now(), dur=500+900*Math.abs(to-from); let last=-1;
    const tick=now=>{ if(!cv.isConnected&&now-t0>200) return;
      const k=Math.min((now-t0)/dur,1), fr=Math.floor((now-t0)/120);
      if(fr!==last||k===1){ last=fr; drawWall(c,from+(to-from)*k,k===1?0:fr); }
      if(k<1) requestAnimationFrame(tick); };
    drawWall(c,from,0); requestAnimationFrame(tick); }
  return el("div",{class:"scene"},cv);
}

// ---- Background music: an original festive loop, made by the browser (no audio file). ----
const Music=(()=>{
  const F={G2:98,A2:110,C3:130.81,D3:146.83,G4:392,A4:440,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5};
  const LEAD=["E5 G5 A5 G5 E5 D5 C5 -","D5 E5 G5 E5 D5 C5 A4 -","E5 G5 A5 C6 A5 G5 E5 -","C5 A4 G4 A4 C5 - C5 -",
              "C5 D5 E5 G5 A5 G5 E5 D5","D5 E5 G5 E5 D5 C5 A4 -","G4 A4 C5 D5 E5 D5 C5 A4","G4 - C5 - C5 - - -"].join(" ").split(" ");
  const BASS=["C3","A2","C3","G2","C3","A2","D3","C3"], E=0.19;
  let ac=null,out=null,noise=null,id=null,step=0,nextT=0;
  function tone(f,t,d,type,v){ const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(out); o.start(t); o.stop(t+d+0.02); }
  function tick(t){ const g=ac.createGain(),s=ac.createBufferSource(),hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=6000;
    s.buffer=noise; g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05); s.connect(hp); hp.connect(g); g.connect(out); s.start(t); s.stop(t+0.06); }
  function plan(){ while(nextT<ac.currentTime+0.3){ const n=LEAD[step], bar=Math.floor(step/8), beat=step%8;
      if(n!=="-"){ tone(F[n],nextT,E*0.95,"square",0.10); tone(F[n]/2,nextT,E*0.6,"square",0.03); }
      if(beat%4===0) tone(F[BASS[bar]],nextT,E*1.8,"triangle",0.22);
      if(beat%2===1) tick(nextT);
      nextT+=E; step=(step+1)%LEAD.length; } }
  return {
    start(){ try{
        if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ac=new AC();
          out=ac.createGain(); out.gain.value=0.5; out.connect(ac.destination);
          noise=ac.createBuffer(1,2205,22050); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
        ac.resume(); if(id) return; nextT=ac.currentTime+0.06; id=setInterval(plan,60); }catch(e){} },
    stop(){ try{ if(id){ clearInterval(id); id=null; } if(ac) ac.suspend(); }catch(e){} }
  };
})();
function toggleMusic(){
  S.music=!S.music;
  try{ localStorage.setItem("china-index-music",S.music?"on":"off"); }catch(e){}
  if(S.music) Music.start(); else Music.stop();
  const b=document.getElementById("mus"); if(b){ b.textContent=S.music?"Music on":"Music off"; b.setAttribute("aria-pressed",String(S.music)); }
}
function stars(){ // a small tile of pixel stars behind everything
  try{ const c=document.createElement("canvas"); c.width=c.height=120; const x=c.getContext("2d");
    [[8,14,"#4a3a80"],[52,6,"#4a3a80"],[96,30,"#b9add9"],[30,58,"#4a3a80"],[76,70,"#4a3a80"],[110,96,"#4a3a80"],[14,100,"#f2b632"]]
      .forEach(([px,py,col])=>{x.fillStyle=col;x.fillRect(px,py,2,2);});
    document.body.style.backgroundImage=`url(${c.toDataURL()})`; }catch(e){}
}

function allPlays(){ // saved plays + my own if it is not saved
  const arr=[...S.plays.entries()].map(([id,p])=>({id,a:p.a,t:p.t,raw:p.raw}));
  if(S.mine && !(S.uid && S.plays.has(S.uid))) arr.push({id:LOCAL_ID,a:S.mine.a,t:S.mine.t,raw:S.mine.raw});
  return arr;
}
const myId=()=> (S.uid && S.plays.has(S.uid)) ? S.uid : LOCAL_ID;

function render(){
  clearInterval(timer);
  const typing=document.activeElement&&document.activeElement.id==="nick";
  app.replaceChildren(garland(), ...(S.screen==="play"?viewPlay():S.screen==="turn"?viewTurn():S.screen==="result"?viewResult():viewHome()).filter(Boolean));
  if(S.screen==="turn"){ const b=document.getElementById("next"); if(b) b.focus({preventScroll:true}); window.scrollTo(0,0); }
  if(S.screen==="play") startTimer();
  if(typing){ const n=document.getElementById("nick"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }
}
function begin(){
  if(S.mine){ S.screen="result"; render(); return; }
  const name=S.nick.trim().slice(0,20);
  if(!name){ S.nickErr=true; render(); const n=document.getElementById("nick"); if(n) n.focus(); return; }
  S.nick=name; S.nickErr=false;
  try{ localStorage.setItem("china-index-nick",name); }catch(e){}
  S.screen="play"; S.qi=0; S.a=[]; S.raw=[]; S.per=[]; render();
}

function viewHome(){
  const n=S.plays.size;
  const nick=el("input",{type:"text",id:"nick",maxlength:"20",autocomplete:"nickname",placeholder:"e.g. Baozi Boss"});
  nick.value=S.nick;
  nick.addEventListener("input",e=>{ S.nick=e.target.value; if(S.nickErr){ S.nickErr=false; const w=document.getElementById("nickwarn"); if(w) w.remove(); } });
  nick.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing) begin(); });
  return [
    mast("Day "+DAY),
    el("section",{class:"panel"},
      el("div",{class:"row2"},el("div",{class:"title",role:"img","aria-label":"Bing Chillion"},
          el("span",null,"BING",sprite("icecream",3)),el("span",null,"CHILLION")),seal("浓度")),
      el("span",{class:"lbl red"},"Today's challenge"),
      el("h1",null,"How long a Great Wall can you build?"),
      el("p",null,`${Q.length} questions. ${SECS} seconds each. The fewer people share your answer, the more wall you build.`)),
    S.mine?null:el("div",{class:"field"},
      el("label",{class:"lbl gold",for:"nick"},"Your nickname (shown on the leaderboard)"),
      nick,
      S.nickErr?el("p",{class:"lbl warn",id:"nickwarn",role:"alert"},"Type a nickname first"):null),
    el("button",{class:"btn",id:"start",onclick:begin}, S.mine?"See my result >":"Start the challenge >"),
    el("p",{class:"lbl soft center"}, S.online ? `${n} ${n===1?"player has":"players have"} finished today` :
        S.tried ? "Can't reach the leaderboard. You can still play" : "Connecting to the leaderboard…"),
    el("div",{class:"cats"},Q.map((q,i)=>el("div",{class:"cat"},el("div",{class:"tile"},sprite(ICONS[i],3)),el("span",null,q.c)))),
    el("ol",{class:"rules"},
      el("li",null,el("span",{class:"lbl gold"},"01"),el("span",null,"One answer per question. No changes after you submit.")),
      el("li",null,el("span",{class:"lbl gold"},"02"),el("span",null,"Type in English, pinyin or Chinese.")),
      el("li",null,el("span",{class:"lbl gold"},"03"),el("span",null,"Answers that aren't on the answer list score 0."))),
    el("p",{class:"note"},"This game doesn't test how much you know. It tests how much you know that other people don't.")
  ];
}

function viewPlay(){
  const q=Q[S.qi];
  const input=el("input",{type:"text",id:"answer",autocomplete:"off",autocapitalize:"off",spellcheck:"false",maxlength:"50",placeholder:"Type one answer","aria-label":q.p});
  input.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing) submit(); });
  setTimeout(()=>input.focus(),0);
  return [
    mast("Day "+DAY),
    el("section",{class:"play"},
      el("div",{class:"qhead"},
        el("span",{class:"lbl"},`Question ${pad(S.qi+1)} / ${pad(Q.length)}`),
        el("span",{class:"secs",id:"secs"},SECS)),
      el("div",{class:"bar"},el("i",{id:"bar"})),
      el("div",{class:"panel qpanel"},
        el("div",{class:"qcat"},el("div",{class:"tile"},sprite(ICONS[S.qi],3)),el("span",{class:"chip"},q.c)),
        el("h2",null,q.p),
        input,
        el("button",{class:"btn",id:"submit",onclick:submit},"Submit answer")))
  ];
}
function startTimer(){
  deadline=Date.now()+SECS*1000;
  timer=setInterval(()=>{
    const left=Math.max(0,deadline-Date.now());
    const s=document.getElementById("secs"), b=document.getElementById("bar");
    if(s) s.textContent=Math.ceil(left/1000);
    if(b) b.style.transform=`scaleX(${Math.ceil(left/(SECS*1000)*30)/30})`;   // moves in chunky steps
    if(left<=0) submit();
  },100);
}
function submit(){
  clearInterval(timer);
  const raw=(document.getElementById("answer")?.value||"").trim().slice(0,50);
  const rec=match(S.qi,raw), ok=!!(rec&&rec.ok);
  S.a[S.qi]= ok ? rec.name : "";
  S.raw[S.qi]= ok ? "" : raw;                 // unknown answers are kept for the owner's "misses" table
  let others=0;                               // how many other players gave this same answer so far
  if(ok) S.plays.forEach((p,id)=>{ if(id!==S.uid && p.a[S.qi]===rec.name) others++; });
  const before=S.per.reduce((x,y)=>x+y,0), pts= ok ? rarity(others+1) : 0;
  S.per[S.qi]=pts;
  S.turn={qi:S.qi, ok, raw, pts, others, before, name: rec?rec.name:raw, note: rec?rec.note:""};
  S.screen="turn"; render();
}
const metres=pts=>Math.round(pts*10).toLocaleString("en-US");
function viewTurn(){ // the score for this answer, and the wall so far
  const t=S.turn, total=t.before+t.pts, last=t.qi===Q.length-1;
  let line;
  if(t.ok) line= t.others===0 ? (S.online?"Nobody else has said this yet. Full points!":"Full points for now. Other players' answers can't be reached right now.")
                              : `${t.others} other ${t.others===1?"player":"players"} said this too.`;
  else if(t.note) line=`Sorry, ${t.note}. No points.`;
  else if(t.raw) line="That isn't on the answer list. No points.";
  else line="Time ran out. No points.";
  const zh= t.ok && t.note && norm(t.note)!==norm(t.name) ? t.note : "";
  return [
    mast("Day "+DAY),
    wallScene(t.before/100,total/100),
    el("section",{class:"panel"},
      el("div",{class:"row2"},el("span",{class:"lbl"},`Question ${pad(t.qi+1)} / ${pad(Q.length)}`),
        el("span",{class:"pts big"+(t.pts?"":" zero")},"+"+t.pts.toFixed(1))),
      el("h2",null, t.ok||t.note ? t.name : (t.raw?`"${t.raw}"`:"No answer")),
      zh?el("p",null,zh):null,
      el("p",null,line+(t.ok?" Points can still change as more people play.":"")),
      el("div",{class:"rank"},el("span",{class:"lbl"},"Wall built so far"),el("strong",null,`${metres(total)} m of 7,000 m`)),
      el("button",{class:"btn",id:"next",onclick:nextTurn}, last?"See my result >":"Next question >"))
  ];
}
function nextTurn(){ if(S.qi<Q.length-1){ S.qi++; S.screen="play"; render(); } else finish(); }
function finish(){
  S.mine={v:2,day:DAY,a:S.a.slice(),raw:S.raw.slice(),t:Date.now(),name:S.nick.trim().slice(0,20)||"Player"};
  try{ localStorage.setItem(LS,JSON.stringify(S.mine)); }catch(e){}
  S.screen="result"; render(); save();
}
async function save(){ // put my play on the shared scoreboard
  if(!S.mine||S.saved||S.saving) return;
  S.saving=true;
  try{
    const r=await fetch(SB_URL+"/rest/v1/plays",{method:"POST",headers:{...HEAD,Prefer:"return=minimal"},
      body:JSON.stringify({day:DAY,player:S.uid,nickname:S.mine.name||"Player",answers:S.mine.a})});
    if(r.ok||r.status===409){ S.saved=true; S.saveFailed=false; sendMisses(); }   // 409 = already saved
    else S.saveFailed=true;
  }catch(e){ S.saveFailed=true; }
  S.saving=false;
  if(S.saved) load(); else if(S.screen==="result") render();
}
function sendMisses(){ // answers the list didn't know go to a private table for the owner
  try{ if(localStorage.getItem(LS+"-misses")) return; localStorage.setItem(LS+"-misses","1"); }catch(e){}
  const rows=(S.mine.raw||[]).map((r,i)=>r?{day:DAY,question:i+1,answer:String(r).slice(0,50)}:null).filter(Boolean);
  if(rows.length) fetch(SB_URL+"/rest/v1/misses",{method:"POST",headers:{...HEAD,Prefer:"return=minimal"},body:JSON.stringify(rows)}).catch(()=>{});
}
async function load(){ // read everyone's plays for today
  let sig=S.sig;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/plays?day=eq.${DAY}&select=player,nickname,answers,created_at&order=created_at.asc&limit=1000`,{headers:HEAD});
    if(!r.ok) throw new Error("load failed");
    const rows=await r.json(), m=new Map();
    rows.forEach(v=>{
      if(!v||!Array.isArray(v.answers)||v.answers.length!==Q.length) return;
      m.set(String(v.player),{a:v.answers.map((x,i)=>typeof x==="string"&&OKSET[i].has(x)?x:""),raw:[],
        t:Date.parse(v.created_at)||0,name:String(v.nickname||"").slice(0,20)});
    });
    S.plays=m; S.online=true;
    if(m.has(S.uid)){ S.saved=true; S.saveFailed=false; if(!S.mine) S.mine={day:DAY,...m.get(S.uid)}; }
    else if(S.mine) save();
    sig="on:"+[...m.keys()].join(",")+":"+S.saved;
  }catch(e){ S.online=false; sig="off"; }
  const first=!S.tried; S.tried=true;
  if((first||sig!==S.sig) && (S.screen==="home"||S.screen==="result")) { S.sig=sig; render(); }   // never interrupt a question
  S.sig=sig;
}

function viewResult(){
  const plays=allPlays(), {counts,rows}=compute(plays), me=myId();
  const idx=rows.findIndex(r=>r.id===me), row=rows[idx], mine=plays.find(p=>p.id===me);
  const t=tierOf(row.score), n=rows.length, score=row.score.toFixed(1);
  const rankText= n>1 ? `No. ${idx+1} of ${n}` : "First player in";
  const pts=row.score*Q.length, towers=Math.floor(pts/100+1e-6);
  const out=[ mast("Day "+DAY),
    wallScene(pts/100,pts/100),
    el("section",{class:"panel"},
      el("div",{class:"row2"},el("span",{class:"lbl"},"My China concentration"),seal(t[2])),
      el("div",{class:"score"},score),
      el("h2",null,t[1]),
      el("p",null,t[3]),
      el("div",{class:"rank"},el("span",{class:"lbl"},"Great Wall built"),el("strong",null,`${metres(pts)} m · ${towers} of 7 towers`)),
      el("div",{class:"rank"},el("span",{class:"lbl"},"Today's rank"),el("strong",null,rankText))),
    el("p",{class:"note"}, n<5 ? "Only a few people have played, so scores run high. As more friends play, scores update by themselves."
        : "This score is provisional. It updates as more people play."),
    (me===LOCAL_ID && S.tried && (S.saveFailed||!S.online)) ?
      el("p",{class:"note"},"Your score isn't on the leaderboard yet. Keep this page open; it will try again by itself.") : null,
    el("div",{class:"acts"},
      el("button",{class:"btn",id:"copy",onclick:async e=>{
        const txt=`Bing Chillion · Day ${DAY}: I scored ${score} (${t[1]}) and built ${metres(pts)} m of Great Wall. ${rankText}.`;
        try{ await navigator.clipboard.writeText(txt); e.target.textContent="Copied!"; }
        catch(err){ e.target.textContent="Couldn't copy. Screenshot instead"; }
      }},"Copy my result as text"),
      el("p",{class:"lbl soft center"},"Want an image? Screenshot the card"))
  ];
  // The reveal
  const sec=el("section",{class:"sec"},el("h3",null,el("span",null,"The reveal"),pixelText("答案揭秘",16,"#f2b632",1)));
  Q.forEach((q,i)=>{
    const my=mine.a[i], rawMine=mine.raw&&mine.raw[i];
    const list=[...counts[i].entries()].sort((x,y)=>y[1]-x[1]), max=list[0]?list[0][1]:1;
    const min=list.length?list[list.length-1][1]:0;
    let line;
    if(my) line=`Your answer: ${my}`;
    else if(rawMine){ const r=match(i,rawMine); line= r&&!r.ok ? `Your answer: ${r.name}. Sorry, ${r.note}. 0 points.` : `Your answer "${rawMine}" isn't on the answer list. 0 points.`; }
    else line="No answer. 0 points.";
    const box=el("div",{class:"panel qa"},
      el("div",{class:"top"},el("strong",null,`${pad(i+1)} ${q.p}`),
        el("span",{class:"pts"+(row.per[i]?"":" zero")},"+"+row.per[i].toFixed(1))),
      el("p",{style:"font-size:15px"},line));
    let shown=list.slice(0,6); const mi=list.findIndex(x=>x[0]===my);
    if(mi>=6) shown=[...list.slice(0,5),list[mi]];
    shown.forEach(([name,c],k)=>{
      const rec=INDEX[i].get(norm(name));
      const note=rec&&rec.note&&norm(rec.note)!==norm(name)?` (${rec.note})`:"";
      box.append(el("div",{class:"row"+(name===my?" me":"")},
        el("span",null,name+note,
          n>1&&k===0&&c>min?el("span",{class:"tag"},"Most popular"):null,
          n>1&&c===min&&c<max&&name===list[list.length-1][0]?el("span",{class:"tag"},"Rarest"):null),
        el("span",{class:"m"},el("i",{style:`width:${Math.round(c/max*100)}%`})),
        el("span",{class:"n"},c)));
    });
    if(list.length>shown.length) box.append(el("p",{class:"lbl"},`+ ${list.length-shown.length} more answers`));
    sec.append(box);
  });
  out.push(sec);
  // Leaderboard
  const board=el("div",{class:"panel qa"});
  rows.slice(0,10).forEach((r,k)=>board.append(el("div",{class:"lb"+(r.id===me?" me":"")},
    el("span",{class:"lbl"},pad(k+1)),
    el("span",null,r.id===me?((S.mine.name||"Me")+" (you)"):((S.plays.get(r.id)||{}).name||"Player "+(k+1))),
    el("span",{class:"lbl"},r.score.toFixed(1)))));
  out.push(el("section",{class:"sec"},el("h3",null,el("span",null,"Leaderboard"),el("span",{class:"lbl gold"},`${n} ${n===1?"player":"players"}`)),board));
  out.push(el("button",{class:"btn ghost",onclick:()=>{S.screen="home";render();}},"Back to the start"));
  return out;
}

function valid(d){ return d&&d.day===DAY&&Array.isArray(d.a)&&d.a.length===Q.length; }

function start(){
  stars();
  try{ const m=JSON.parse(localStorage.getItem(LS)||"null"); if(valid(m)) S.mine=m; }catch(e){}
  try{ S.nick=localStorage.getItem("china-index-nick")||""; S.music=localStorage.getItem("china-index-music")!=="off"; }catch(e){}
  document.addEventListener("pointerdown",e=>{ if(S.music && !(e.target&&e.target.id==="mus")) Music.start(); },{once:true});   // browsers only allow sound after a tap
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) Music.stop(); else if(S.music) Music.start(); });
  S.uid=playerId();
  render(); load();
  setInterval(()=>{ if(S.screen!=="play" && !document.hidden) load(); }, 20000);   // refresh the scores every 20 seconds
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.screen!=="play") load(); });
}
start();
}
